# @package _global_
wandb:
  mode: online
  experiment: helix

bo:
  n_iters: 20
  checkpoint: true
  checkpoint_freq: 1

run_name: "${hydra:runtime.choices.acqf_optimizer}_${acqf_optimizer.sampler.q}"

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      dataset: tiny_lib
      acquisition: posterior_mean
      acqf_optimizer: greedy/qucb,greedy/ts,greedy/top_k,greedy/top_k_modes
      acqf_optimizer.sampler.q: 1000,2500,5000,10000
      model: tanimoto_gp
      oracle: tiny_lib/jnk3
      seed: range(0,3)
  launcher:
    timeout_min: 60
    array_parallelism: 15
