# @package _global_
wandb:
  mode: online
  experiment: helix

bo:
  n_iters: 20
  checkpoint: true
  checkpoint_freq: 1

run_name: "${hydra:runtime.choices.acquisition}_${model.beta}"

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      dataset: tiny_lib
      acquisition: ei,ucb_beta_0.1,posterior_mean
      acqf_optimizer: pool_sampler
      acqf_optimizer.q: 50
      acqf_optimizer.max_batch_size: 256
      model: reward_shaped_tanimoto_gp
      model.beta: 2,4,8,16,32,64
      oracle: tiny_lib/jnk3
      seed: range(0,5)
