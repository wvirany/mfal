# @package _global_
wandb:
  mode: online
  experiment: gfn_bo

bo:
  n_iters: 40
  checkpoint: true
  checkpoint_freq: 4

run_name: "${hydra:runtime.choices.acqf_optimizer}_${hydra:runtime.choices.acquisition}_q25"

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      dataset: tiny_lib
      acquisition: qei,qucb
      acqf_optimizer: pool_maximizer
      acqf_optimizer.q: 25
      acqf_optimizer.max_batch_size: 256
      model: tanimoto_gp
      oracle: tiny_lib/qed
      seed: range(0,10)
