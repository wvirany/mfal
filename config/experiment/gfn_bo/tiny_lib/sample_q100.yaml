# @package _global_
wandb:
  mode: online
  experiment: gfn_bo

bo:
  n_iters: 10
  checkpoint: true
  checkpoint_freq: 1

run_name: "${hydra:runtime.choices.acqf_optimizer}_${hydra:runtime.choices.acquisition}_q100"

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      dataset: tiny_lib
      acquisition: ei,ucb
      acqf_optimizer: pool_sampler
      acqf_optimizer.q: 100
      acqf_optimizer.max_batch_size: 512
      model: tanimoto_gp
      oracle: tiny_lib/qed
      seed: range(0,10)
