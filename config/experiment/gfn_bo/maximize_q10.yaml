# @package _global_
wandb:
  mode: online
  experiment: gfn_bo

bo:
  n_iters: 100
  checkpoint: true
  checkpoint_freq: 10

run_name: "${hydra:runtime.choices.acqf_optimizer}_${hydra:runtime.choices.acquisition}_q10"

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      dataset: tiny_lib
      acquisition: qei,qucb
      acqf_optimizer: pool_maximizer
      acqf_optimizer.q: 10
      acqf_optimizer.max_batch_size: 512
      model: tanimoto_gp
      oracle: tiny_lib/qed
      seed: range(0,10)
