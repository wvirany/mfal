# @package _global_
wandb:
  mode: online
  experiment: gfn_bo_zinc250k

bo:
  n_iters: 100
  checkpoint: true
  checkpoint_freq: 10

run_name: "${hydra:runtime.choices.acqf_optimizer}_${hydra:runtime.choices.acquisition}_${hydra:runtime.choices.oracle}_q10"
n: 50000

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      dataset: zinc250k
      acquisition: qei,qucb
      acqf_optimizer: pool_maximizer
      acqf_optimizer.q: 10
      acqf_optimizer.max_batch_size: 128
      model: tanimoto_gp
      oracle: zinc250k/qed,zinc250k/jnk3
      seed: range(0,5)
  launcher:
    timeout_min: 120
    max_num_timeout: 1
