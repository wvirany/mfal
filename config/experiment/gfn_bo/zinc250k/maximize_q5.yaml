# @package _global_
wandb:
  mode: online
  experiment: gfn_bo_zinc250k

bo:
  n_iters: 200
  checkpoint: true
  checkpoint_freq: 20

run_name: "${hydra:runtime.choices.acqf_optimizer}_${hydra:runtime.choices.acquisition}_${hydra:runtime.choices.oracle}_q5"

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      dataset: zinc250k
      acquisition: qei,qucb
      acqf_optimizer: pool_maximizer
      acqf_optimizer.q: 5
      acqf_optimizer.max_batch_size: 256
      model: tanimoto_gp
      oracle: zinc250k/qed,zinc250k/jnk3,zinc250k/gsk3b
      seed: range(0,5)
  launcher:
    timeout_min: 180
    max_num_timeout: 1
