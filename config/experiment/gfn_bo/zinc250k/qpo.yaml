# @package _global_
wandb:
  mode: online
  experiment: gfn_bo_zinc250k

bo:
  n_iters: ${div:1000,${acqf_optimizer.q}}
  checkpoint: true
  checkpoint_freq: ${div:100,${acqf_optimizer.q}}

run_name: "${hydra:runtime.choices.acqf_optimizer}_${hydra:runtime.choices.acquisition}_${hydra:runtime.choices.oracle}_q${acqf_optimizer.q}"
n: 50000

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      dataset: zinc250k
      acquisition: qpo
      acqf_optimizer: pool_sampler
      acqf_optimizer.q: 1,5,10,25,50,100
      acqf_optimizer.max_batch_size: 512
      model: tanimoto_gp
      oracle: zinc250k/qed,zinc250k/jnk3
      seed: range(0,5)
  launcher:
    timeout_min: 120
    max_num_timeout: 1
