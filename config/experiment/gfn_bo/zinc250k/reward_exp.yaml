# @package _global_
wandb:
  mode: online
  experiment: gfn_bo_zinc250k

bo:
  n_iters: 1000
  checkpoint: true

run_name: "${hydra:runtime.choices.acqf_optimizer}_${hydra:runtime.choices.acquisition}_${hydra:runtime.choices.oracle}"
n: 50000

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      dataset: zinc250k
      acquisition: ei,ucb
      acqf_optimizer: pool_sampler
      acqf_optimizer.q: 1,10,25
      acqf_optimizer.max_batch_size: 512
      model: reward_shaped_tanimoto_gp
      model.beta: 2,4,8,16
      oracle: zinc250k/qed,zinc250k/jnk3
      seed: range(0,5)
  launcher:
    timeout_min: 120
    max_num_timeout: 1
