# @package _global_
wandb:
  mode: online
  experiment: gfn_bo_zinc250k

bo:
  n_iters: 1000
  checkpoint: true

run_name: "${hydra:runtime.choices.acqf_optimizer}_${hydra:runtime.choices.acquisition}_${hydra:runtime.choices.oracle}"
n: 50000

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      dataset: zinc250k
      acquisition: ts
      acqf_optimizer: thompson_sampler
      acqf_optimizer.q: 1,5,10,25,50,100
      acqf_optimizer.max_batch_size: 512
      model: tanimoto_gp
      oracle: zinc250k/qed,zinc250k/jnk3
      seed: range(0,5)
  launcher:
    timeout_min: 120
    max_num_timeout: 1
