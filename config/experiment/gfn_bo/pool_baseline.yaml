# @package _global_
wandb:
  mode: online
  experiment: gfn_bo

bo:
  n_iters: 500
  checkpoint: true

run_name: "maximize_qed_${hydra:runtime.choices.acquisition}_tanimoto_gp"

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      dataset: tiny_lib
      acquisition: ei,ucb
      acqf_optimizer: pool_maximizer,pool_sampler
      model: tanimoto_gp
      oracle: tiny_lib/qed
      seed: range(0,10)
