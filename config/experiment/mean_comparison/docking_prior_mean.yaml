# @package _global_
wandb:
  mode: online
  experiment: docking_prior_mean

bo:
  n_iters: 500
  checkpoint: true
  checkpoint_freq: 25

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      acquisition: ei
      model: tanimoto_gp
      model/mean_module: mcl1_docking
      oracle: mcl1/mmgbsa
      seed: range(0,5)
