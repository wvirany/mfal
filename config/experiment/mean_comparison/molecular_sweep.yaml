# @package _global_
wandb:
  mode: online
  experiment: mean_comparison

bo:
  n_iters: 1000
  save_checkpoint: true
  load_checkpoint: true

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      acquisition: ei,ucb,ts
      model: tanimoto_gp
      model/mean_module: obs_mean,obs_max,obs_min
      oracle: mcl1/qed,mcl1/vina,mcl1/mmgbsa
      seed: range(0,5)
