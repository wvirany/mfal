# @package _global_
wandb:
  mode: online
  experiment: mean_comparison

bo:
  n_iters: 500
  checkpoint: true

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      acquisition: ei,ucb,ts
      model: tanimoto_gp
      oracle: mcl1/qed,mcl1/vina,mcl1/mmgbsa
      seed: range(0,5)
  launcher:
    timeout_min: 120
    mem_gb: 32
    gres: gpu:h100:1
