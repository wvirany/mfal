# @package _global_
wandb:
  mode: online
  experiment: qei_scaling

bo:
  n_iters: 20
  checkpoint: true
  checkpoint_freq: 1

n: 50000
run_name: "qei_${hydra:runtime.choices.acquisition/sampler}"

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      dataset: zinc250k
      acquisition: qei
      acquisition/sampler: kb
      acqf_optimizer: pool_maximizer
      acqf_optimizer.q: 50
      acqf_optimizer.max_batch_size: 128
      model: tanimoto_gp
      oracle: zinc250k/qed
      seed: range(0,3)
  launcher:
    timeout_min: 180
    array_parallelism: 5
